name: ci-cd.yml
on:
  push:
    branches: ["main","develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-quality-gate:
    name: Build, Test & SonarQube Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #Full history required for SonarQube blame analysis
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grand Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: execute Reactive Unit Test & Generate JaCoCo Coverae
        run: ./gradlew test jacocoTestReport

      - name: Run SonarQube Scanner & Evaluate Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=fluxpay-transfer-engine \
            -Dsonar.projectName="Flux Transfer Engine" \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          
