apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-transfer-engine
  labels:
    app: fluxpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluxpay
  template:
    metadata:
      labels:
        app: fluxpay
    spec:
      containers:
        - name: fluxpay-app
          image: fluxpay-transfer-engine:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: FLUXPAY_AES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxpay-secrets
                  key: aes-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10