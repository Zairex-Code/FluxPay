plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'org.sonarqube' version '5.0.0.4638'
}

group = 'com.fluxpay'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // =========================================================================
    // 🌐 WEBFLUX & CORE REACTIVO
    // =========================================================================
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // =========================================================================
    // 💾 PERSISTENCIA & DATOS REACTIVOS (R2DBC, PostgreSQL, Redis)
    // =========================================================================
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // =========================================================================
    // 📡 MENSAJERÍA & EVENTOS (Kafka Reactivo)
    // =========================================================================
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.projectreactor.kafka:reactor-kafka'

    // =========================================================================
    // 🛡️ RESILIENCIA & TOLERANCIA A FALLOS (Resilience4j)
    // =========================================================================
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // =========================================================================
    // 📊 OBSERVABILIDAD & MÉTRICAS (Bloque 7 - Actuator & Prometheus)
    // =========================================================================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // =========================================================================
    // 🛠️ HERRAMIENTAS DE DESARROLLO (Lombok)
    // =========================================================================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // =========================================================================
    // 🧪 PRUEBAS Y COBERTURA (Testing, StepVerifier & Mocks)
    // =========================================================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// =============================================================================
// ⚙️ TAREAS DE EJECUCIÓN DE PRUEBAS & REPORTE DE COBERTURA (JaCoCo)
// =============================================================================
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// =============================================================================
// 🔍 CONFIGURACIÓN DE INSPECCIÓN Y QUALITY GATE (SonarCloud)
// =============================================================================
sonar {
    properties {
        property "sonar.projectKey", "fluxpay-transfer-engine"
        property "sonar.projectName", "FluxPay Transfer Engine"
        property "sonar.organization", "zairex-code"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "https://sonarcloud.io"
        property "sonar.gradle.skipCompile", "true"
        property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
    }
}